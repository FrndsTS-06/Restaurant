services:
  - type: web
    name: restaurantpro-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://savoria-restaurant.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://savoria-restaurant.vercel.app,http://localhost:5173
      - key: COOKIE_SAME_SITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_restaurantpro2026
      - key: RAZORPAY_KEY_SECRET
        value: restaurantpro_rzp_secret_key_sandbox
      - key: RAZORPAY_WEBHOOK_SECRET
        value: restaurantpro_rzp_webhook_secret_sandbox_2026
      - key: CLOUDINARY_CLOUD_NAME
        value: demo
      - key: CLOUDINARY_API_KEY
        value: placeholder_key
      - key: CLOUDINARY_API_SECRET
        value: placeholder_secret
      - key: EMAIL_DEV_MODE
        value: "true"
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        value: placeholder_pass
      - key: EMAIL_FROM
        value: "SAVORIA Haute Cuisine <concierge@savoria.com>"
