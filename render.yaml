services:
  # ==============================================================================
  # 1. BACKEND API (Node.js / Express Web Service)
  # ==============================================================================
  - type: web
    name: restaurantpro-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://restaurantpro-client.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://restaurantpro-client.onrender.com,http://localhost:5173
      - key: COOKIE_SAME_SITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_restaurantpro2026
      - key: RAZORPAY_KEY_SECRET
        value: restaurantpro_rzp_secret_key_sandbox
      - key: RAZORPAY_WEBHOOK_SECRET
        value: restaurantpro_rzp_webhook_secret_sandbox_2026
      - key: CLOUDINARY_CLOUD_NAME
        value: demo
      - key: CLOUDINARY_API_KEY
        value: placeholder_key
      - key: CLOUDINARY_API_SECRET
        value: placeholder_secret
      - key: EMAIL_DEV_MODE
        value: "true"
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        value: placeholder_pass
      - key: EMAIL_FROM
        value: "SAVORIA Haute Cuisine <concierge@savoria.com>"

  # ==============================================================================
  # 2. FRONTEND SPA (React / Vite / Three.js 3D Static Site)
  # ==============================================================================
  - type: web
    name: restaurantpro-client
    runtime: static
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://restaurantpro-api.onrender.com/api
